<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="45%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f9bff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#4f9bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8ab4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#c7d6ee" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9cc2ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#5b7bb8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="300" cy="120" r="520" fill="url(#glowA)"/>
  <circle cx="1320" cy="220" r="560" fill="url(#glowB)"/>
  <circle cx="820" cy="940" r="620" fill="url(#glowC)"/>

  <!-- light streak -->
  <polygon points="-200,640 900,-260 1040,-260 -60,740" fill="url(#streak)"/>

  <!-- oversized faint M motif echoing the brand mark -->
  <g opacity="0.9">
    <path d="M560 760 L560 320 L800 560 L1040 320 L1040 760 L955 760 L955 470 L800 625 L645 470 L645 760 Z"
          fill="url(#mFill)" stroke="#6f9bff" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <!-- thin geometric accents -->
  <g stroke="#7aa2ff" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <path d="M0 820 L460 360"/>
    <path d="M1600 300 L1180 760"/>
  </g>

  <!-- particles -->
  <g fill="#cfe0ff" fill-opacity="0.5">
    <circle cx="220" cy="300" r="2"/>
    <circle cx="1180" cy="180" r="2.5"/>
    <circle cx="1380" cy="520" r="2"/>
    <circle cx="420" cy="700" r="2"/>
    <circle cx="980" cy="240" r="1.8"/>
    <circle cx="700" cy="820" r="2.2"/>
    <circle cx="1280" cy="700" r="1.8"/>
  </g>

  <!-- bottom fade for text legibility / smooth blend into page -->
  <rect width="1600" height="1000" fill="url(#base)" opacity="0.18"/>
</svg>
